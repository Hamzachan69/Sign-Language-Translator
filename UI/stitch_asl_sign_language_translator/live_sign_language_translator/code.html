<div class="p-gutter-lg space-y-space-md max-w-[1720px] mx-auto w-full"><!-- Clean Desktop Application Container -->
<div class="rounded-xl bg-surface-container-lowest shadow-2xl border border-surface-container-high/40 overflow-hidden flex flex-col min-h-[calc(100vh-3rem)] max-w-[1440px] mx-auto">
<!-- TOP BAR: Controls Left | Centered Title | Minimal Utilities Right -->
<header class="h-16 bg-surface-container-low px-space-lg flex items-center justify-between border-b border-surface-container-high/50 select-none relative">
<!-- Top-Left: Algorithm & Camera Dropdowns + Live Status -->
<div class="flex items-center gap-space-md z-10">
<!-- Algorithm Selection Dropdown -->
<div class="flex items-center gap-1.5 bg-surface-container px-space-md py-1.5 rounded-lg border border-surface-container-high/40 text-on-surface font-label-sm text-label-sm">

<select class="bg-transparent text-on-surface font-medium focus:outline-none cursor-pointer pr-1">
<option class="bg-surface-container-high text-on-surface" value="alg1">Algorithm 1 (MediaPipe + Transformer)</option>
<option class="bg-surface-container-high text-on-surface" value="alg2">Algorithm 2 (Spatial Temporal GCN)</option>
<option class="bg-surface-container-high text-on-surface" value="alg3">Algorithm 3 (Lightweight MobileNet)</option>
</select>
</div>
<!-- Camera Selection Dropdown -->
<div class="flex items-center gap-1.5 bg-surface-container px-space-md py-1.5 rounded-lg border border-surface-container-high/40 text-on-surface font-label-sm text-label-sm">
<span class="material-symbols-outlined text-secondary text-base">videocam</span>
<select class="bg-transparent text-on-surface font-medium focus:outline-none cursor-pointer pr-1">
<option class="bg-surface-container-high text-on-surface" value="cam1">Integrated HD Webcam (1080p)</option>
<option class="bg-surface-container-high text-on-surface" value="cam2">External USB Camera</option>
<option class="bg-surface-container-high text-on-surface" value="cam3">Depth Sensor Camera</option>
</select>
</div>
<!-- Status Indicator Pill -->
<div class="flex items-center gap-1.5 px-space-sm py-1 bg-surface-container rounded-full text-secondary font-label-sm text-label-sm border border-secondary/20">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="font-semibold">Live</span>
<span class="text-outline">•</span>
<span class="">60 FPS</span>
</div>
</div>
<!-- Centered Prominent App Title -->

<!-- Top-Right: Minimalist Controls -->
<div class="flex items-center gap-space-xs z-10">
<button class="w-9 h-9 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface-variant hover:text-on-surface flex items-center justify-center transition-colors" title="Toggle Audio Output" type="button">
<span class="material-symbols-outlined text-lg">volume_up</span>
</button>
<button class="w-9 h-9 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface-variant hover:text-on-surface flex items-center justify-center transition-colors" title="Toggle Fullscreen" type="button">
<span class="material-symbols-outlined text-lg">fullscreen</span>
</button>
<button class="w-9 h-9 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface-variant hover:text-on-surface flex items-center justify-center transition-colors" title="Settings" type="button">
<span class="material-symbols-outlined text-lg">settings</span>
</button>
</div>
</header>
<!-- MAIN BODY: Focused Camera Viewport -->
<div class="flex-1 p-space-lg flex flex-col gap-space-md justify-center items-center bg-surface-dim">
<div class="relative w-full max-w-[1040px] aspect-[16/10] bg-surface-container-lowest rounded-2xl overflow-hidden shadow-2xl border border-surface-container-high/60 group">
<!-- Live Camera Feed Image -->
<img class="w-full h-full object-cover" data-alt="Sign language user signing clearly with both hands in dark high-contrast setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBnarDvHQct40DY4CIModULzFETSJBBODYZnLpNjeum0Xk-pPO0OFXHCbVmYZLOM5mpYaz-Xb_M9FTGm5ItmjYhNpGn5Ef-qgHphQesIelTzlOA7SJaD76qG5EaSFkZCNHLf_dQlLPqyEcyPpAtpVipHS4lZvnKRVbaMRlR2OfM7r5cUr5xv-517LBsxgHZwuYFThqANyESL6acSQYCWFovv22Gbhx4JDgSmrMzvMU">
<!-- Landmark Wireframe HUD Overlay (Clean Subtle Landmarks) -->

<line stroke="currentColor" stroke-width="1.5" x1="270" x2="245" y1="390" y2="410"></line>
<polygon fill="rgba(78, 222, 163, 0.15)" points="280,350 260,370 270,390 300,385 295,360" stroke="currentColor" stroke-width="1.5"></polygon>
<circle class="fill-secondary" cx="235" cy="340" r="4"></circle>
<circle class="fill-secondary" cx="205" cy="385" r="4.5"></circle>
<circle class="fill-secondary" cx="225" cy="425" r="4"></circle>
<circle class="fill-secondary" cx="280" cy="350" r="5"></circle>
<circle cx="280" cy="350" fill="url(#jointGlow)" r="14"></circle>
</g>
<!-- Right Hand Landmark Mesh (Tertiary / Primary Subtle) -->
<g class="text-tertiary">
<polygon fill="rgba(255, 185, 95, 0.15)" points="520,340 540,360 535,385 505,380 500,355" stroke="currentColor" stroke-width="1.5"></polygon>
<line stroke="currentColor" stroke-width="1.5" x1="520" x2="545" y1="340" y2="335"></line>
<line stroke="currentColor" stroke-width="1.5" x1="540" x2="575" y1="360" y2="370"></line>
<circle class="fill-tertiary" cx="565" cy="330" r="4"></circle>
<circle class="fill-tertiary" cx="600" cy="375" r="4.5"></circle>
<circle class="fill-tertiary" cx="520" cy="340" r="5"></circle>
</g>
</svg>
<!-- Minimalist Top HUD on Video -->
<div class="absolute top-space-md left-space-md right-space-md flex items-center justify-between pointer-events-none select-none">
<div class="flex items-center gap-space-xs pointer-events-auto">
<span class="px-space-sm py-1 rounded-full bg-surface-container-lowest/80 backdrop-blur-md text-secondary font-label-sm text-label-sm flex items-center gap-1.5 shadow-md border border-secondary/20">
<span class="w-2 h-2 rounded-full bg-secondary animate-ping"></span>
            TRACKING ACTIVE
          </span>
<span class="px-space-sm py-1 rounded bg-surface-container-lowest/80 backdrop-blur-md text-on-surface font-label-sm text-label-sm shadow-md border border-surface-container-high/40">
            1080p • 60 FPS
          </span>
</div>
<div class="flex items-center gap-1 bg-surface-container-lowest/80 backdrop-blur-md px-space-sm py-1 rounded-lg pointer-events-auto font-label-sm text-label-sm text-outline border border-surface-container-high/40">
<span class="">Confidence:</span>
<strong class="text-secondary">98.4%</strong>
</div>
</div>
</div>
</div>
<!-- BOTTOM TRANSLATION AREA (TWO-TIER HIERARCHY) -->
<footer class="bg-surface-container-low border-t border-surface-container-high/60 p-space-lg flex flex-col gap-space-md">
<!-- TIER 1: LETTER-BY-LETTER LIVE GENERATION BAR -->
<div class="rounded-xl bg-surface-container p-space-md border border-surface-container-high/50 flex flex-col md:flex-row md:items-center justify-between gap-space-md shadow-md">
<div class="flex items-center gap-space-md flex-wrap">
<!-- Active Buffer Label with Green Status Pill -->
<div class="flex items-center gap-2 px-space-md py-1 rounded-full bg-secondary/15 text-secondary font-label-sm text-label-sm border border-secondary/30 shadow-[0_0_10px_rgba(78,222,163,0.25)]">
<span class="w-2 h-2 rounded-full bg-secondary animate-ping"></span>
<span class="font-bold tracking-wider uppercase">Generating Word (Letter by Letter)</span>
</div>
<!-- Individual Real-Time Letter Tiles with Green Pulsing Focus -->
<div class="flex items-center gap-1.5" id="letterBufferContainer">
<span class="w-9 h-9 rounded-lg bg-surface-container-high text-secondary flex items-center justify-center font-label-lg text-lg font-bold border border-secondary/30 shadow-sm">H</span>
<span class="w-9 h-9 rounded-lg bg-surface-container-high text-secondary flex items-center justify-center font-label-lg text-lg font-bold border border-secondary/30 shadow-sm">E</span>
<span class="w-9 h-9 rounded-lg bg-surface-container-high text-secondary flex items-center justify-center font-label-lg text-lg font-bold border border-secondary/30 shadow-sm">L</span>
<span class="w-9 h-9 rounded-lg bg-surface-container-high text-secondary flex items-center justify-center font-label-lg text-lg font-bold border border-secondary/30 shadow-sm">L</span>
<!-- Active pulsating green letter tile -->
<span class="w-9 h-9 rounded-lg bg-secondary text-on-secondary flex items-center justify-center font-label-lg text-lg font-extrabold shadow-[0_0_14px_rgba(78,222,163,0.6)] animate-pulse">O</span>
<!-- Cursor pulse -->
<span class="w-2 h-7 bg-secondary/80 rounded animate-pulse ml-0.5"></span>
</div>
</div>
<!-- Real-time latency & sub-token status -->
<div class="flex items-center gap-space-md text-outline font-label-sm text-label-sm">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-secondary text-sm">bolt</span>
<span class="">Latency: <strong class="text-on-surface">14ms</strong></span>
</span>
<span class="hidden sm:inline-block px-2 py-0.5 rounded bg-surface-container-high text-on-surface-variant">
          Next: Space [99.1%]
        </span>
</div>
</div>
<!-- TIER 2: SENTENCE FORMATION STREAM -->
<div class="rounded-xl bg-surface-container-lowest p-space-md border border-surface-container-high/60 flex flex-col md:flex-row md:items-center justify-between gap-space-md shadow-lg">
<div class="flex-1 min-w-0 pr-space-md">
<div class="flex items-center gap-space-xs font-label-sm text-label-sm mb-1">
<span class="material-symbols-outlined text-primary text-base">chat</span>
<span class="text-primary font-bold uppercase tracking-wider">Active Sentence Stream</span>
</div>
<p class="font-headline-sm text-headline-sm text-on-surface font-medium leading-relaxed truncate" id="activeSentenceText">
          “Hello, welcome everyone to today's interactive session.”
        </p>
</div>
<!-- Action Buttons: New Sentence, Clear, Copy -->
<div class="flex items-center gap-space-xs shrink-0 flex-wrap">
<!-- Prominent 'New Sentence' Button -->
<button class="flex items-center gap-2 px-space-md py-2 rounded-lg bg-primary hover:bg-primary-fixed text-on-primary font-semibold text-body-sm transition-all shadow-md active:scale-95" id="newSentenceBtn" type="button">
<span class="material-symbols-outlined text-lg">add_circle</span>
<span class="">New Sentence</span>
</button>
<!-- Copy Button -->
<button class="flex items-center gap-1.5 px-space-md py-2 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface transition-colors font-label-sm text-label-sm border border-surface-container-high/40" id="copySentenceBtn" title="Copy Sentence to Clipboard" type="button">
<span class="material-symbols-outlined text-base">content_copy</span>
<span class="">Copy</span>
</button>
<!-- Clear Button -->
<button class="flex items-center gap-1.5 px-space-md py-2 rounded-lg bg-surface-container hover:bg-error/20 hover:text-error text-on-surface-variant transition-colors font-label-sm text-label-sm border border-surface-container-high/40" id="clearSentenceBtn" title="Clear Active Sentence" type="button">
<span class="material-symbols-outlined text-base">delete_sweep</span>
<span class="">Clear</span>
</button>
</div>
</div>
</footer>
</div></div>
</div>
<script>
  (function() {
    // Interactive skeleton overlay toggling
    const toggleMeshBtn = document.getElementById('toggleMeshBtn');
    let meshActive = true;
    if (toggleMeshBtn) {
      toggleMeshBtn.addEventListener('click', () => {
        meshActive = !meshActive;
        if (meshActive) {
          toggleMeshBtn.className = "flex items-center gap-1 px-space-sm py-1 rounded-full bg-secondary/20 text-secondary font-label-sm text-label-sm hover:bg-secondary/30 transition-colors";
          toggleMeshBtn.innerHTML = '<span class="material-symbols-outlined text-base">hub</span><span>Skeletons: ON</span>';
        } else {
          toggleMeshBtn.className = "flex items-center gap-1 px-space-sm py-1 rounded-full bg-surface-container-high text-outline font-label-sm text-label-sm hover:bg-surface-container-highest transition-colors";
          toggleMeshBtn.innerHTML = '<span class="material-symbols-outlined text-base">hub</span><span>Skeletons: OFF</span>';
        }
      });
    }

    // TTS speech synthesis toggle state
    const ttsToggle = document.getElementById('ttsToggle');
    let ttsActive = true;
    if (ttsToggle) {
      ttsToggle.addEventListener('click', () => {
        ttsActive = !ttsActive;
        if (ttsActive) {
          ttsToggle.classList.remove('text-outline');
          ttsToggle.classList.add('text-secondary');
          ttsToggle.innerHTML = '<span class="material-symbols-outlined text-lg">volume_up</span><span class="font-semibold">Speech Synthesis On</span>';
        } else {
          ttsToggle.classList.remove('text-secondary');
          ttsToggle.classList.add('text-outline');
          ttsToggle.innerHTML = '<span class="material-symbols-outlined text-lg">volume_off</span><span class="font-semibold">Speech Synthesis Muted</span>';
        }
      });
    }

    // Copy to clipboard mock
    const copyBtn = document.getElementById('copyBtn');
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const text = document.getElementById('transcriptTicker').innerText;
        navigator.clipboard?.writeText(text);
        const original = copyBtn.innerHTML;
        copyBtn.innerHTML = '<span class="material-symbols-outlined text-lg text-secondary">check</span><span class="text-secondary">Copied!</span>';
        setTimeout(() => {
          copyBtn.innerHTML = original;
        }, 1800);
      });
    }

    // Clear buffer interaction
    const clearBtn = document.getElementById('clearBtn');
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        const original = clearBtn.innerHTML;
        clearBtn.innerHTML = '<span class="material-symbols-outlined text-lg text-primary">done</span><span>Cleared</span>';
        setTimeout(() => {
          clearBtn.innerHTML = original;
        }, 1400);
      });
    }
  })();
</script></main></div>

</body></html>
