<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>ASL Sign Language Translator</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "error": "#ffb4ab",
            "surface-bright": "#31394d",
            "surface-container": "#171f33",
            "primary-fixed-dim": "#c0c1ff",
            "on-error-container": "#ffdad6",
            "primary-container": "#8083ff",
            "tertiary-fixed-dim": "#ffb95f",
            "on-surface-variant": "#c7c4d7",
            "secondary-container": "#00a572",
            "surface-tint": "#c0c1ff",
            "on-primary-fixed-variant": "#2f2ebe",
            "tertiary-container": "#ca8100",
            "background": "#0b1326",
            "on-tertiary": "#472a00",
            "secondary": "#4edea3",
            "primary": "#c0c1ff",
            "primary-fixed": "#e1e0ff",
            "secondary-fixed": "#6ffbbe",
            "on-tertiary-fixed": "#2a1700",
            "on-surface": "#dae2fd",
            "on-primary-container": "#0d0096",
            "surface-dim": "#0b1326",
            "surface": "#0b1326",
            "tertiary": "#ffb95f",
            "outline": "#908fa0",
            "on-secondary": "#003824",
            "surface-container-highest": "#2d3449",
            "inverse-primary": "#494bd6",
            "on-background": "#dae2fd",
            "surface-container-low": "#131b2e",
            "surface-variant": "#2d3449",
            "inverse-on-surface": "#283044",
            "on-secondary-container": "#00311f",
            "tertiary-fixed": "#ffddb8",
            "on-primary": "#1000a9",
            "inverse-surface": "#dae2fd",
            "on-secondary-fixed": "#002113",
            "secondary-fixed-dim": "#4edea3",
            "on-tertiary-container": "#3e2400",
            "on-tertiary-fixed-variant": "#653e00",
            "on-primary-fixed": "#07006c",
            "on-secondary-fixed-variant": "#005236",
            "surface-container-lowest": "#060e20",
            "surface-container-high": "#222a3d",
            "on-error": "#690005",
            "error-container": "#93000a",
            "outline-variant": "#464554"
          },
          fontFamily: {
            "body": ["Inter"],
            "mono": ["JetBrains Mono"],
          },
        }
      }
    }
  </script>
  <style>
    html, body { margin: 0; padding: 0; }
    body { overscroll-behavior: none; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-background font-body text-[15px] leading-[22px] text-on-surface min-h-screen selection:bg-primary-container selection:text-on-primary-container">

<main class="w-full min-h-screen bg-background flex flex-col items-center justify-center relative overflow-hidden">
  <!-- Ambient glow effects -->
  <div class="pointer-events-none absolute -top-24 left-1/4 h-96 w-96 rounded-full bg-primary-container/15 blur-[120px]"></div>
  <div class="pointer-events-none absolute bottom-10 right-10 h-80 w-80 rounded-full bg-secondary/10 blur-[100px]"></div>

  <div class="relative z-10 flex flex-col items-center justify-center text-center px-6 py-8 max-w-2xl mx-auto gap-8">
    <!-- App Icon + Title -->
    <div class="flex flex-col items-center gap-2">
      <div class="w-12 h-12 rounded-xl bg-surface-container-high flex items-center justify-center mb-1 shadow-md">
        <span class="material-symbols-outlined text-primary text-[28px]">sign_language</span>
      </div>
      <h1 class="text-4xl lg:text-5xl font-bold tracking-tight">
        <span class="bg-gradient-to-r from-primary via-primary-fixed to-secondary bg-clip-text text-transparent">
          Live Sign Language Translator
        </span>
      </h1>
      <p class="text-on-surface-variant text-[15px] mt-2 max-w-md">
        Real-time ASL recognition powered by MediaPipe hand tracking and a Convolutional Neural Network.
      </p>
    </div>

    <!-- Start Button -->
    <div>
      <a class="group inline-flex items-center gap-3 px-8 py-5 rounded-xl bg-primary text-on-primary font-semibold text-lg transition-all duration-300 hover:bg-primary-fixed shadow-[0_0_24px_rgba(192,193,255,0.35)] hover:shadow-[0_0_36px_rgba(192,193,255,0.55)] hover:scale-[1.02]"
         href="/translate">
        <span class="material-symbols-outlined text-[24px] group-hover:rotate-6 transition-transform">videocam</span>
        <span>Start Now</span>
        <span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1">arrow_forward</span>
      </a>
    </div>

    <!-- Quick info pills -->
    <div class="flex flex-wrap items-center justify-center gap-3 text-xs">
      <span class="px-3 py-1.5 rounded-full bg-surface-container border border-surface-container-high/40 text-on-surface-variant font-mono">
        36 ASL Signs (A-Z, 0-9)
      </span>
      <span class="px-3 py-1.5 rounded-full bg-surface-container border border-surface-container-high/40 text-on-surface-variant font-mono">
        CNN Model
      </span>
      <span class="px-3 py-1.5 rounded-full bg-surface-container border border-surface-container-high/40 text-on-surface-variant font-mono">
        MediaPipe Tracking
      </span>
    </div>
  </div>
</main>

</body>
</html>
